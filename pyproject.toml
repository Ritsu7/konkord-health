[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konkord-health"
version = "1.0.0"
description = "Konkord: healthcare source-to-target data assurance platform"
requires-python = ">=3.10"
authors = [{name = "Naveen Vasantha Kumar"}]
license = "Apache-2.0"
dependencies = ["hl7>=0.4.5", "fhir.resources>=7.1"]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
hl7 = ["hl7>=0.4.5", "fhir.resources>=7.1"]
dev = []

[project.scripts]
konkord = "konkord.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
