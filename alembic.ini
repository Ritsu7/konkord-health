[alembic]
script_location = alembic
prepend_sys_path = .

# Actual DB URL is resolved at runtime in alembic/env.py from
# KONKORD_DATABASE_URL (falls back to the same local SQLite default as the
# app). This placeholder is unused but kept for `alembic` CLI compatibility.
sqlalchemy.url = sqlite:///./konkord.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
